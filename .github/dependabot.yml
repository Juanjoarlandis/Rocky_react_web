# Actualizaciones semanales de dependencias npm y de las acciones de CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Actualiza'
    groups:
      # El cliente: son del build (devDependencies) y la imagen de producción no
      # los lleva, así que `npm audit --omit=dev` ya no los cubre. Los audita el
      # `npm audit` completo del CI, y aquí se actualizan juntos.
      cliente:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router'
      herramientas:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'stylelint*'
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'globals'
          - 'concurrently'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: 'Actualiza'
